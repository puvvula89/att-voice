<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AT&amp;T Support Line</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --att-blue: #009fdb;
      --att-blue-600: #0078ab;
      --att-blue-700: #00567c;
      --att-navy: #00263e;
      --ink: #0a2a3d;
      --ink-soft: #4a6577;
      --surface: #ffffff;
      --surface-alt: #f2f8fc;
      --surface-line: #dce8f1;
      --bubble-agent: #eef5fa;
      --live: #2bb673;
      --danger: #e0142b;
      --adk: #1a73e8;       /* Google ADK / Gemini Live */
      --cxas: #6b4cc6;      /* CX Agent Studio */
      --shadow: 0 24px 60px -28px rgba(0, 38, 62, 0.4);
      --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: "Inter", system-ui, -apple-system, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1100px 600px at 12% -10%, #dceef9 0%, transparent 55%),
        radial-gradient(900px 600px at 110% 120%, #d2e9f6 0%, transparent 50%),
        #eef5fa;
      -webkit-font-smoothing: antialiased;
    }

    .app {
      height: 100dvh;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    /* ---- Header ---- */
    header {
      display: flex; align-items: center; gap: 14px;
      padding: 13px 24px;
      color: #fff;
      background: linear-gradient(120deg, var(--att-blue) 0%, var(--att-blue-700) 100%);
    }
    .globe { width: 32px; height: 32px; flex: none; }
    .brand { display: flex; flex-direction: column; line-height: 1.1; }
    .brand b { font-weight: 800; letter-spacing: 0.3px; font-size: 17px; }
    .brand span { font-size: 12px; opacity: 0.85; font-weight: 500; }
    .live-chip {
      margin-left: auto;
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 12px; font-weight: 600;
      padding: 6px 12px; border-radius: 999px;
      background: rgba(255, 255, 255, 0.16);
    }
    .live-dot { width: 8px; height: 8px; border-radius: 50%; background: #cfe9ff; }
    .live-chip[data-on="true"] .live-dot { background: var(--live); animation: pulse 1.8s infinite; }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(43, 182, 115, 0.55); }
      70% { box-shadow: 0 0 0 7px rgba(43, 182, 115, 0); }
      100% { box-shadow: 0 0 0 0 rgba(43, 182, 115, 0); }
    }

    /* ---- Stage: graph | transcript ---- */
    .stage {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(360px, 44%);
      min-height: 0;
    }

    /* ---- Graph panel ---- */
    .graph-panel {
      position: relative;
      padding: 18px 20px;
      min-height: 0;
      border-right: 1px solid var(--surface-line);
      display: flex; flex-direction: column;
    }
    .panel-title {
      font-size: 11px; font-weight: 700; letter-spacing: 0.6px;
      text-transform: uppercase; color: var(--ink-soft); margin: 2px 2px 6px;
    }
    .graph { flex: 1; min-height: 0; }
    .graph svg { width: 100%; height: 100%; display: block; }

    .edge { fill: none; stroke: #c4d6e3; stroke-width: 2.4; }
    .graph.live .edge { stroke: #8fc2e4; stroke-dasharray: 6 7; animation: flow 1.1s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -26; } }

    /* platform container boxes */
    .group.adk .area { fill: rgba(26, 115, 232, 0.05); stroke: #a9c9f2; stroke-width: 1.6; }
    .group.cxas .area { fill: rgba(107, 76, 198, 0.06); stroke: #cdbcee; stroke-width: 1.6; }
    .group .tab text { fill: #fff; font: 700 12px "Inter", sans-serif; letter-spacing: 0.2px; }
    .group.adk .tab rect { fill: var(--adk); }
    .group.cxas .tab rect { fill: var(--cxas); }

    .node .box { fill: #fff; stroke: var(--surface-line); stroke-width: 1.5; transition: stroke 0.25s var(--ease); filter: drop-shadow(0 6px 14px rgba(0, 38, 62, 0.08)); }
    .node.infra .box { fill: #f7fbfe; }
    .node .disc { fill: #b9cad6; transition: fill 0.25s var(--ease); }
    .node.infra .disc { fill: #8aa3b3; }
    .ic-svg { color: #fff; }
    .node .nm { font: 600 13px "Inter", sans-serif; fill: var(--ink); }
    .node .sub { font: 500 10.5px "Inter", sans-serif; fill: var(--ink-soft); }
    .node .pulse { fill: var(--live); opacity: 0; }
    .node.active .box { stroke: var(--att-blue); stroke-width: 2.6; }
    .node.active .pulse { opacity: 1; animation: pulse 1.8s infinite; }
    .node.active[data-key="greeter"] .disc { fill: var(--ink-soft); }
    .node.active[data-key="internet"] .disc { fill: var(--att-blue); }
    .node.active[data-key="phone_upgrade"] .disc { fill: #0d8f6f; }
    .node.active[data-key="billing"] .disc { fill: var(--cxas); }

    /* ---- Transcript ---- */
    .transcript { display: flex; flex-direction: column; min-height: 0; }
    .transcript h2 {
      margin: 0; padding: 16px 20px 12px;
      font-size: 11px; font-weight: 700; letter-spacing: 0.6px;
      text-transform: uppercase; color: var(--ink-soft);
      border-bottom: 1px solid var(--surface-line);
    }
    .feed { flex: 1; overflow-y: auto; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; scroll-behavior: smooth; }
    .empty { margin: auto; text-align: center; color: var(--ink-soft); font-size: 13.5px; max-width: 230px; line-height: 1.5; }
    .empty svg { width: 32px; height: 32px; opacity: 0.4; margin-bottom: 10px; }
    .bubble {
      max-width: 84%; padding: 10px 14px; border-radius: 14px;
      font-size: 14px; line-height: 1.45; white-space: pre-wrap; word-break: break-word;
      animation: rise 0.22s var(--ease);
    }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .bubble .who { display: block; font-size: 11px; font-weight: 700; letter-spacing: 0.3px; text-transform: uppercase; opacity: 0.7; margin-bottom: 3px; }
    .bubble.agent { align-self: flex-start; background: var(--bubble-agent); color: var(--ink); border-bottom-left-radius: 4px; }
    .bubble.user { align-self: flex-end; background: var(--att-blue); color: #fff; border-bottom-right-radius: 4px; }
    .bubble.partial { opacity: 0.72; }

    /* ---- Dock (centered call + waveform) ---- */
    .dock {
      border-top: 1px solid var(--surface-line);
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(6px);
      padding: 14px 20px 18px;
      display: grid; place-items: center;
    }
    .dock-inner { display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%; }
    .viz-wrap {
      width: min(460px, 92vw); height: 84px;
      border-radius: 14px; overflow: hidden; position: relative;
      background: linear-gradient(180deg, #04314c 0%, #00263e 100%);
      display: grid; place-items: center;
    }
    .viz-wrap canvas { width: 100%; height: 100%; display: block; }
    .viz-idle { position: absolute; color: rgba(255, 255, 255, 0.55); font-size: 12.5px; font-weight: 500; pointer-events: none; transition: opacity 0.4s var(--ease); }
    .controls { display: flex; align-items: center; gap: 18px; }
    .btn { font-family: inherit; cursor: pointer; border: none; display: grid; place-items: center;
      transition: transform 0.15s var(--ease), background 0.2s var(--ease), box-shadow 0.2s var(--ease), opacity 0.2s var(--ease); }
    .btn:active { transform: scale(0.94); }
    .btn:focus-visible { outline: 3px solid var(--att-blue); outline-offset: 3px; }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-call { width: 64px; height: 64px; border-radius: 50%; background: var(--att-blue); color: #fff; box-shadow: 0 10px 24px -8px rgba(0, 159, 219, 0.8); }
    .btn-call:hover:not(:disabled) { background: var(--att-blue-600); }
    .btn-call.hangup { background: var(--danger); box-shadow: 0 10px 24px -8px rgba(224, 20, 43, 0.7); }
    .btn-call.hangup:hover:not(:disabled) { background: #bb0f22; }
    .btn-call svg { width: 27px; height: 27px; }
    .btn-mute { width: 50px; height: 50px; border-radius: 50%; background: var(--surface-alt); border: 1px solid var(--surface-line); color: var(--ink); }
    .btn-mute:hover:not(:disabled) { background: #e6f1f8; }
    .btn-mute[aria-pressed="true"] { background: var(--danger); border-color: var(--danger); color: #fff; }
    .btn-mute svg { width: 21px; height: 21px; }
    .status { font-size: 13px; font-weight: 500; color: var(--ink-soft); min-height: 18px; text-align: center; }

    /* ---- Responsive ---- */
    @media (max-width: 920px) {
      .stage { grid-template-columns: 1fr; grid-template-rows: minmax(280px, 46vh) 1fr; }
      .graph-panel { border-right: none; border-bottom: 1px solid var(--surface-line); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <svg class="globe" viewBox="0 0 100 100" aria-hidden="true">
        <defs><clipPath id="g"><circle cx="50" cy="50" r="46" /></clipPath></defs>
        <circle cx="50" cy="50" r="46" fill="rgba(255,255,255,0.12)" stroke="#fff" stroke-width="3" />
        <g clip-path="url(#g)" stroke="#fff" stroke-width="3.4" fill="none" opacity="0.95">
          <path d="M4 36 H96" /><path d="M4 50 H96" /><path d="M4 64 H96" />
          <path d="M10 24 H90" /><path d="M10 76 H90" />
          <ellipse cx="50" cy="50" rx="20" ry="46" />
        </g>
      </svg>
      <div class="brand"><b>AT&amp;T</b><span>Support Line</span></div>
      <div class="live-chip" id="liveChip" data-on="false">
        <span class="live-dot"></span><span id="liveLabel">Offline</span>
      </div>
    </header>

    <div class="stage">
      <!-- Flow graph -->
      <section class="graph-panel">
        <div class="panel-title">Call flow</div>
        <div class="graph" id="graph"></div>
      </section>

      <!-- Transcript -->
      <section class="transcript">
        <h2>Live transcript</h2>
        <div class="feed" id="feed" aria-live="polite">
          <div class="empty" id="empty">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
            The conversation with the agent will appear here.
          </div>
        </div>
      </section>
    </div>

    <!-- Dock: waveform + call controls, dead center -->
    <div class="dock">
      <div class="dock-inner">
        <div class="viz-wrap">
          <canvas id="viz" aria-hidden="true"></canvas>
          <span class="viz-idle" id="vizIdle">Tap call to begin</span>
        </div>
        <div class="controls">
          <button class="btn btn-mute" id="muteBtn" aria-label="Mute microphone" aria-pressed="false" disabled></button>
          <button class="btn btn-call" id="callBtn" aria-label="Start call"></button>
        </div>
        <p class="status" id="status">Ready when you are.</p>
      </div>
    </div>
  </div>

  <script>
    // ---- SVG icons (no emoji) ----
    const ICON = {
      phone: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.6.1.4 0 .7-.2 1l-2.3 2.2z"/></svg>',
      hangup: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 9c-1.6 0-3.2.3-4.6.7v3.1c0 .4-.2.7-.5.9-.9.4-1.7 1-2.5 1.6-.2.2-.4.3-.7.3-.3 0-.5-.1-.7-.3l-2.3-2.3c-.2-.2-.3-.4-.3-.7 0-.3.1-.5.3-.7C3.6 8.5 7.5 7 12 7s8.4 1.5 11.4 3.9c.2.2.3.4.3.7 0 .3-.1.5-.3.7l-2.3 2.3c-.2.2-.4.3-.7.3-.3 0-.5-.1-.7-.3-.8-.7-1.6-1.2-2.5-1.6-.3-.2-.5-.5-.5-.9V9.7C15.2 9.3 13.6 9 12 9z"/></svg>',
      mic: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 19v3"/></svg>',
      micOff: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 9v-4a3 3 0 0 1 5.1-2.1M15 9.3V5M5 10a7 7 0 0 0 10.7 6M19 10a7 7 0 0 1-.9 3.4M12 19v3M2 2l20 20"/></svg>',
      // graph node icons
      audiocodes: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M21 3l-7 7"/><path d="M20.5 16.5v3a1.5 1.5 0 0 1-1.6 1.5A18 18 0 0 1 2.5 4.6 1.5 1.5 0 0 1 4 3h3a1.5 1.5 0 0 1 1.5 1.3c.1.9.3 1.8.6 2.6a1.5 1.5 0 0 1-.4 1.5L7.8 11a14 14 0 0 0 5 5l1.6-1.3a1.5 1.5 0 0 1 1.5-.3c.8.3 1.7.5 2.6.6a1.5 1.5 0 0 1 1.4 1.5z"/></svg>',
      relay: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01"/></svg>',
      greeter: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 13v-1a8 8 0 0 1 16 0v1M4 13a2 2 0 0 0 2 2h0v-4H6a2 2 0 0 0-2 2zM20 13a2 2 0 0 1-2 2h0v-4h0a2 2 0 0 1 2 2zM18 15v1a3 3 0 0 1-3 3h-3"/></svg>',
      internet: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8.5a16 16 0 0 1 20 0M5 12a11 11 0 0 1 14 0M8.5 15.5a6 6 0 0 1 7 0"/><circle cx="12" cy="19" r="1" fill="currentColor"/></svg>',
      phone_upgrade: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M12 6V13M9.5 10.5 12 8l2.5 2.5"/></svg>',
      billing: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M2.5 9.5h19M6 14.5h5"/></svg>',
    };
    const AGENT_LABEL = { greeter: "Greeter", internet: "Internet support", phone_upgrade: "Phone upgrade", billing: "Billing" };

    // ---- Flowchart definition (left -> right), with platform containers ----
    const VB_W = 900, VB_H = 400, BW = 172, BH = 58;
    const NODES = [
      { key: "audiocodes",    x: 100, y: 150, kind: "infra", label: "AudioCodes",       icon: ICON.audiocodes },
      { key: "relay",         x: 300, y: 150, kind: "infra", label: "Relay",            icon: ICON.relay },
      { key: "greeter",       x: 510, y: 150, kind: "agent", label: "Greeter", sub: "Classify / Route", icon: ICON.greeter },
      { key: "internet",      x: 780, y: 96,  kind: "agent", label: "Internet support", icon: ICON.internet },
      { key: "phone_upgrade", x: 780, y: 204, kind: "agent", label: "Phone upgrade",    icon: ICON.phone_upgrade },
      { key: "billing",       x: 780, y: 343, kind: "agent", label: "Billing",          icon: ICON.billing },
    ];
    const EDGES = [
      ["audiocodes", "relay"], ["relay", "greeter"],
      ["greeter", "internet"], ["greeter", "phone_upgrade"], ["greeter", "billing"],
    ];
    // Platform grouping: Agent Engine wraps the ADK agents; CXAS wraps billing.
    const GROUPS = [
      { cls: "adk",  x: 410, y: 40,  w: 470, h: 222, label: "Agent Engine · ADK",     tw: 172 },
      { cls: "cxas", x: 686, y: 300, w: 194, h: 86,  label: "CX Agent Studio · CXAS", tw: 188 },
    ];
    const byKey = Object.fromEntries(NODES.map(n => [n.key, n]));

    function edgePath(a, b) {
      const sx = a.x + BW / 2 + 2, sy = a.y, ex = b.x - BW / 2 - 4, ey = b.y, mx = (sx + ex) / 2;
      return `M${sx} ${sy} C ${mx} ${sy} ${mx} ${ey} ${ex} ${ey}`;
    }
    function groupSvg(g) {
      return `<g class="group ${g.cls}">` +
        `<rect class="area" x="${g.x}" y="${g.y}" width="${g.w}" height="${g.h}" rx="18"/>` +
        `<g class="tab"><rect x="${g.x + 16}" y="${g.y - 13}" width="${g.tw}" height="26" rx="13"/>` +
        `<text x="${g.x + 16 + g.tw / 2}" y="${g.y + 5}" text-anchor="middle">${g.label}</text></g></g>`;
    }
    function nodeSvg(n) {
      const bx = n.x - BW / 2, by = n.y - BH / 2, dcx = bx + 30, dcy = n.y, tl = bx + 54;
      const ic = n.icon.replace("<svg ", `<svg class="ic-svg" x="${dcx - 11}" y="${dcy - 11}" width="22" height="22" `);
      const label = n.sub
        ? `<text class="nm" x="${tl}" y="${n.y - 4}">${n.label}</text><text class="sub" x="${tl}" y="${n.y + 12}">${n.sub}</text>`
        : `<text class="nm" x="${tl}" y="${n.y + 4}">${n.label}</text>`;
      return `<g class="node ${n.kind}" data-key="${n.key}">` +
        `<rect class="box" x="${bx}" y="${by}" width="${BW}" height="${BH}" rx="14"/>` +
        `<circle class="disc" cx="${dcx}" cy="${dcy}" r="16"/>${ic}${label}` +
        `<circle class="pulse" cx="${bx + BW - 14}" cy="${by + 14}" r="4.5"/></g>`;
    }
    function buildGraph() {
      const defs = `<defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9fb9cb"/></marker></defs>`;
      const groups = GROUPS.map(groupSvg).join("");
      const edges = EDGES.map(([a, b]) => `<path class="edge" marker-end="url(#ah)" d="${edgePath(byKey[a], byKey[b])}"/>`).join("");
      const nodes = NODES.map(nodeSvg).join("");
      $("graph").innerHTML =
        `<svg viewBox="0 0 ${VB_W} ${VB_H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Call flow diagram">${defs}${groups}${edges}${nodes}</svg>`;
    }

    // ---- Mode + relay endpoint ----
    // /audiocodes = observe-only monitor (no mic, no call button, watches a live
    // call on /observe). Anything else (/browser, /) = caller mode on /ws.
    const OBSERVE = /\/audiocodes\/?$/.test(location.pathname);
    const WS_PATH = OBSERVE ? "/observe" : "/ws";
    // ?relay=wss://… overrides. Local dev → relay on :8080. Otherwise the page is
    // served BY the relay, so connect same-origin.
    const RELAY = new URLSearchParams(location.search).get("relay")
      || ((location.hostname === "localhost")
        ? "ws://localhost:8080" + WS_PATH
        : (location.protocol === "https:" ? "wss://" : "ws://") + location.host + WS_PATH);

    // ---- DOM ----
    const $ = (id) => document.getElementById(id);
    const callBtn = $("callBtn"), muteBtn = $("muteBtn"), statusEl = $("status");
    const feed = $("feed"), emptyEl = $("empty");
    const graphEl = $("graph");
    const liveChip = $("liveChip"), liveLabel = $("liveLabel"), vizIdle = $("vizIdle");
    const canvas = $("viz"), cctx = canvas.getContext("2d");

    // ---- State ----
    let ws, actx, playCtx, micStream, proc, playTime = 0;
    let micAnalyser, playAnalyser, rafId;
    let inCall = false, muted = false, agentStarted = false, currentAgent = "";
    let audioReady = false; // observe mode: playback context resumed after a gesture
    const partials = { user: null, agent: null };

    buildGraph();
    setCallButton(false);
    setMuteIcon();

    // ---- UI helpers ----
    function setStatus(t) { statusEl.textContent = t; }
    function setLive(on, label) { liveChip.dataset.on = on; liveLabel.textContent = label; }
    function setCallButton(active) {
      callBtn.classList.toggle("hangup", active);
      callBtn.innerHTML = active ? ICON.hangup : ICON.phone;
      callBtn.setAttribute("aria-label", active ? "End call" : "Start call");
    }
    function setMuteIcon() {
      muteBtn.innerHTML = muted ? ICON.micOff : ICON.mic;
      muteBtn.setAttribute("aria-pressed", String(muted));
      muteBtn.setAttribute("aria-label", muted ? "Unmute microphone" : "Mute microphone");
    }
    function highlightAgent(key) {
      if (!AGENT_LABEL[key]) return;
      currentAgent = key;
      graphEl.querySelectorAll(".node.agent").forEach(n =>
        n.classList.toggle("active", n.dataset.key === key));
    }
    function resetAgents() {
      currentAgent = "";
      graphEl.querySelectorAll(".node.active").forEach(n => n.classList.remove("active"));
    }
    function setCallActive(active) { graphEl.querySelector("svg").classList.toggle("live", active); }

    // ---- Transcript (append deltas, replace on cumulative final) ----
    function onTranscript(role, text, final) {
      if (!text) return;
      emptyEl.style.display = "none";
      let bubble = partials[role];
      if (!bubble) {
        bubble = document.createElement("div");
        bubble.className = "bubble " + role + " partial";
        const who = document.createElement("span");
        who.className = "who";
        who.textContent = role === "user" ? "You" : (AGENT_LABEL[currentAgent] || "Agent");
        const body = document.createElement("span");
        bubble.append(who, body);
        feed.appendChild(bubble);
        bubble._txt = body;
        partials[role] = bubble;
      }
      if (final) { bubble._txt.textContent = text; bubble.classList.remove("partial"); partials[role] = null; }
      else { bubble._txt.textContent += text; }
      feed.scrollTop = feed.scrollHeight;
    }

    // ---- Visualizer ----
    function fitCanvas() {
      const r = canvas.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
      canvas.width = r.width * dpr; canvas.height = r.height * dpr;
      cctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    function drawViz() {
      rafId = requestAnimationFrame(drawViz);
      const w = canvas.clientWidth, h = canvas.clientHeight;
      cctx.clearRect(0, 0, w, h);
      const BARS = 52, gap = 2, bw = (w - gap * (BARS - 1)) / BARS, mid = h / 2;
      const md = micAnalyser ? new Uint8Array(micAnalyser.frequencyBinCount) : null;
      const pd = playAnalyser ? new Uint8Array(playAnalyser.frequencyBinCount) : null;
      if (md && !muted) micAnalyser.getByteFrequencyData(md);
      if (pd) playAnalyser.getByteFrequencyData(pd);
      const agentHot = pd && pd.some(v => v > 8);
      for (let i = 0; i < BARS; i++) {
        const idx = Math.floor((i / BARS) * (pd ? pd.length / 2 : 1));
        const mv = (md && !muted) ? md[idx] / 255 : 0;
        const pv = pd ? pd[idx] / 255 : 0;
        const bh = Math.max(2, Math.max(mv, pv) * (h * 0.86));
        const x = i * (bw + gap);
        cctx.fillStyle = agentHot ? "rgba(0,159,219,0.95)"
          : (mv > 0.02 ? "rgba(120,220,255,0.9)" : "rgba(255,255,255,0.16)");
        cctx.beginPath();
        cctx.roundRect(x, mid - bh / 2, bw, bh, bw / 2);
        cctx.fill();
      }
    }

    // ---- Call lifecycle ----
    async function start() {
      inCall = true; agentStarted = false; muted = false;
      partials.user = partials.agent = null;
      setCallButton(true);
      muteBtn.disabled = false; setMuteIcon();
      setStatus("Connecting…");
      setLive(true, "Connecting");
      resetAgents(); setCallActive(true);
      vizIdle.style.opacity = "0";
      feed.querySelectorAll(".bubble").forEach(b => b.remove());
      emptyEl.style.display = "";

      // Playback context at device default rate; resume on this user gesture.
      playCtx = new AudioContext();
      await playCtx.resume();
      playTime = playCtx.currentTime;
      playAnalyser = playCtx.createAnalyser();
      playAnalyser.fftSize = 256;

      const sock = ws = new WebSocket(RELAY);
      ws.onmessage = (e) => {
        const m = JSON.parse(e.data);
        if (m.type === "audio") { markAgentStarted(); playPcm24(m.data); }
        else if (m.type === "transcript") { markAgentStarted(); onTranscript(m.role, m.text, m.final); }
        else if (m.type === "agent") highlightAgent(m.key);
        else if (m.type === "session_end") { setStatus("Call ended by agent."); stop(); }
      };
      ws.onopen = () => { setLive(true, "Connected"); setStatus("Connected — speak when ready."); };
      ws.onerror = () => setStatus("Connection error.");
      ws.onclose = () => { if (inCall) { setStatus("Disconnected."); stop(); } };

      // Capture at 16 kHz.
      actx = new AudioContext({ sampleRate: 16000 });
      micStream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true } });
      const src = actx.createMediaStreamSource(micStream);
      micAnalyser = actx.createAnalyser(); micAnalyser.fftSize = 256;
      src.connect(micAnalyser);
      proc = actx.createScriptProcessor(4096, 1, 1);
      src.connect(proc);
      proc.connect(actx.destination); // REQUIRED or onaudioprocess never fires
      proc.onaudioprocess = (ev) => {
        // Gate: only after the agent has started (avoids flooding the engine's
        // inbound queue during greeting setup), not while muted, not while the
        // agent is speaking (half-duplex), and only on THIS call's socket.
        if (sock.readyState !== 1 || !agentStarted || muted || isAgentSpeaking()) return;
        const f32 = ev.inputBuffer.getChannelData(0);
        const i16 = new Int16Array(f32.length);
        for (let i = 0; i < f32.length; i++) {
          const s = Math.max(-1, Math.min(1, f32[i]));
          i16[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
        }
        sock.send(JSON.stringify({ type: "audio", data: b64(new Uint8Array(i16.buffer)) }));
      };

      fitCanvas();
      cancelAnimationFrame(rafId);
      drawViz();
    }

    function markAgentStarted() {
      if (agentStarted) return;
      agentStarted = true;
      setLive(true, "Live");
      setStatus("Connected.");
    }
    function isAgentSpeaking() { return !!playCtx && playTime > playCtx.currentTime + 0.05; }

    function playPcm24(b64data) {
      // No audible playback until the context is running (observe mode stays
      // suspended until the user clicks once — browsers block autoplay).
      if (!playCtx || playCtx.state !== "running") return;
      const std = b64data.replace(/-/g, "+").replace(/_/g, "/");
      const bytes = Uint8Array.from(atob(std), c => c.charCodeAt(0));
      const i16 = new Int16Array(bytes.buffer);
      const buf = playCtx.createBuffer(1, i16.length, 24000); // tag buffer at 24k
      const ch = buf.getChannelData(0);
      for (let i = 0; i < i16.length; i++) ch[i] = i16[i] / 0x8000;
      const node = playCtx.createBufferSource();
      node.buffer = buf;
      node.connect(playCtx.destination);
      if (playAnalyser) node.connect(playAnalyser);
      const t = Math.max(playTime, playCtx.currentTime + 0.12);
      node.start(t);
      playTime = t + buf.duration;
    }

    function toggleMute() {
      if (!inCall) return;
      muted = !muted; setMuteIcon();
      setStatus(muted ? "Microphone muted." : "Listening…");
    }

    function stop() {
      if (!inCall) return;
      inCall = false;
      try { ws && ws.readyState === 1 && ws.send(JSON.stringify({ type: "end" })); } catch (e) {}
      try { ws && ws.close(); } catch (e) {}
      try { proc && (proc.onaudioprocess = null, proc.disconnect()); } catch (e) {}
      try { micStream && micStream.getTracks().forEach(t => t.stop()); } catch (e) {}
      try { actx && actx.close(); } catch (e) {}
      // Keep ONE reused playback context (closing chops the goodbye + churns the limit).
      cancelAnimationFrame(rafId);
      cctx.clearRect(0, 0, canvas.width, canvas.height);
      micAnalyser = null;
      ws = proc = micStream = actx = null;
      agentStarted = false; muted = false;
      muteBtn.disabled = true;
      setCallButton(false); setMuteIcon();
      resetAgents(); setCallActive(false);
      setLive(false, "Offline");
      vizIdle.textContent = "Call ended — tap to call again";
      vizIdle.style.opacity = "1";
      if (statusEl.textContent === "Connected." || statusEl.textContent.startsWith("Listening"))
        setStatus("Call ended.");
    }

    const b64 = (u8) => { let s = ""; for (const b of u8) s += String.fromCharCode(b); return btoa(s); };

    // ---- Observe mode (the /audiocodes monitor) ----
    function enableAudio() {
      if (audioReady) return;
      audioReady = true;
      try { playCtx && playCtx.resume(); } catch (e) {}
      document.removeEventListener("pointerdown", enableAudio);
      if (liveChip.dataset.on !== "true") setStatus("Observing — waiting for a call…");
      else setStatus("Live call in progress.");
    }

    function startObserve() {
      // Build the (suspended) playback context now; it resumes on first click.
      if (!playCtx) {
        playCtx = new AudioContext();
        playTime = playCtx.currentTime;
        playAnalyser = playCtx.createAnalyser();
        playAnalyser.fftSize = 256;
      }
      fitCanvas();
      cancelAnimationFrame(rafId);
      drawViz();
      connectObserve();
    }

    function connectObserve() {
      ws = new WebSocket(RELAY);
      ws.onmessage = (e) => handleObserveFrame(JSON.parse(e.data));
      ws.onopen = () => setStatus(audioReady ? "Observing — waiting for a call…" : "Connected — click anywhere to enable audio.");
      ws.onerror = () => {};
      ws.onclose = () => {
        setLive(false, "Offline");
        setStatus("Disconnected — reconnecting…");
        // Keep the wall monitor alive across calls / cold starts.
        setTimeout(() => { if (OBSERVE) connectObserve(); }, 2500);
      };
    }

    function handleObserveFrame(m) {
      if (m.type === "call_active") return observeCallActive();
      if (m.type === "call_idle") return observeCallIdle();
      if (m.type === "call_end") return observeCallEnd();
      if (m.type === "audio") return playPcm24(m.data);
      if (m.type === "transcript") { observeLive(); return onTranscript(m.role, m.text, m.final); }
      if (m.type === "agent") { observeLive(); return highlightAgent(m.key); }
    }

    function observeLive() {
      if (liveChip.dataset.on === "true") return;
      setLive(true, "Live");
      setCallActive(true);
      vizIdle.style.opacity = "0";
      setStatus(audioReady ? "Live call in progress." : "Live — click anywhere to enable audio.");
    }
    function observeCallActive() {
      partials.user = partials.agent = null;
      feed.querySelectorAll(".bubble").forEach(b => b.remove());
      emptyEl.style.display = "";
      resetAgents();
      observeLive();
    }
    function observeCallIdle() {
      setLive(false, "Waiting");
      setCallActive(false);
      resetAgents();
      vizIdle.textContent = "Waiting for a call…";
      vizIdle.style.opacity = "1";
      setStatus("Observing — waiting for a call…");
    }
    function observeCallEnd() {
      observeCallIdle();
      setStatus("Call ended — waiting for the next call…");
    }

    // ---- Startup (mode-aware) ----
    if (OBSERVE) {
      document.querySelector(".controls").style.display = "none";
      const sub = document.querySelector(".brand span");
      if (sub) sub.textContent = "Live call monitor";
      vizIdle.textContent = "Waiting for a call…";
      setLive(false, "Waiting");
      setStatus("Connecting…");
      document.addEventListener("pointerdown", enableAudio);
      startObserve();
    } else {
      callBtn.onclick = () => (inCall ? stop() : start());
      muteBtn.onclick = toggleMute;
    }
    window.addEventListener("resize", () => { if (inCall || OBSERVE) fitCanvas(); });
    window.addEventListener("pagehide", () => { try { playCtx && playCtx.close(); } catch (e) {} });
  </script>
</body>
</html>
