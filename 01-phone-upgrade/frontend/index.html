<!doctype html>
<html>
  <head><meta charset="utf-8"><title>AT&T Phone Upgrade</title>
    <style>
      body{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;max-width:1000px;margin:24px auto;padding:0 16px;color:#1a1a1a}
      .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #eee;padding-bottom:10px}
      .topbar h1{font-size:20px;margin:0}
      .status{font-size:13px;padding:4px 10px;border-radius:999px;white-space:nowrap}
      .status.idle{background:#eee;color:#666}
      .status.listening{background:#e6f4ea;color:#137333}
      .status.user{background:#e8f0fe;color:#1967d2}
      .status.agent{background:#fce8e6;color:#c5221f}
      #start{font-size:16px;padding:8px 16px;margin:16px 0;cursor:pointer;border:1px solid #1967d2;background:#1967d2;color:#fff;border-radius:8px}
      #start:disabled{opacity:.6;cursor:default}

      /* Two-column layout: left = transcript + raw JSON, right = rendered screen */
      .layout{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
      .col-left{display:flex;flex-direction:column;gap:16px}
      .panel{border:1px solid #eee;border-radius:10px;padding:12px}
      .panel.screen{min-height:480px}
      .panel-title{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:#888;margin:0 0 10px}
      @media(max-width:720px){.layout{grid-template-columns:1fr}}

      /* Rendered screen components */
      .screen-title{font-size:18px;margin:0 0 4px}
      .screen-msg{font-size:14px;color:#555;margin:0 0 14px}

      .option-list{display:flex;flex-direction:column;gap:8px}
      .option-row{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;
                  text-align:left;cursor:pointer;border:1px solid #e2e5e9;border-radius:10px;
                  padding:12px 14px;background:#fff;transition:border-color .15s,box-shadow .15s}
      .option-row:hover{border-color:#1967d2;box-shadow:0 1px 6px rgba(25,103,210,.12)}
      .opt-header{font-size:15px;font-weight:600}
      .opt-eyebrow{font-size:12px;color:#777;margin-top:2px}
      .chev{font-size:22px;color:#aab}

      .phone-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
      .phone-card{cursor:pointer;border:1px solid #e2e5e9;border-radius:12px;padding:14px 10px;
                  text-align:center;background:#fff;transition:border-color .15s,box-shadow .15s,transform .1s}
      .phone-card:hover{border-color:#1967d2;box-shadow:0 2px 10px rgba(25,103,210,.14);transform:translateY(-1px)}
      .phone-thumb{height:96px;display:flex;align-items:center;justify-content:center;font-size:46px;margin-bottom:8px}
      .phone-thumb img{max-height:96px;max-width:100%;object-fit:contain}
      .card-eyebrow{font-size:11px;font-weight:600;color:#1967d2;text-transform:uppercase;letter-spacing:.03em;min-height:14px}
      .card-name{font-size:14px;font-weight:600;margin:2px 0 6px}
      .price{display:flex;flex-direction:column;line-height:1.15}
      .price-prefix{font-size:11px;color:#777}
      .price-amount{font-size:18px;font-weight:700}
      .price-suffix{font-size:11px;color:#777}

      .summary{border:1px solid #eee;border-radius:10px;overflow:hidden;margin-bottom:16px}
      .summary-row{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;font-size:14px}
      .summary-row:nth-child(odd){background:#fafbfc}
      .summary-label{color:#777}
      .summary-value{font-weight:600;text-align:right}
      .primary-btn{width:100%;font-size:16px;font-weight:600;padding:12px;cursor:pointer;border:0;
                   border-radius:10px;background:#1967d2;color:#fff}
      .primary-btn:hover{background:#1457b8}
      .receipt-badge{width:56px;height:56px;border-radius:50%;background:#e6f4ea;color:#137333;
                     font-size:30px;display:flex;align-items:center;justify-content:center;margin:4px 0 16px}

      .transcript{max-height:220px;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
      .bubble{max-width:80%;padding:8px 12px;border-radius:14px;font-size:14px;line-height:1.4}
      .bubble .who{display:block;font-size:11px;opacity:.6;margin-bottom:2px}
      .bubble.agent{align-self:flex-start;background:#f1f3f4}
      .bubble.user{align-self:flex-end;background:#1967d2;color:#fff}
      .bubble.user .who{color:#dbe7fb}

      .raw{margin:0;max-height:260px;overflow:auto;background:#0f172a;color:#d1e0ff;border-radius:8px;
           padding:12px;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre}
      .raw:empty::before{content:"// the JSON sent for the rendered component appears here";color:#64748b}
    </style>
  </head>
  <body>
    <header class="topbar">
      <h1>AT&T Phone Upgrade</h1>
      <div id="status" class="status idle">Idle</div>
    </header>
    <button id="start">Start call</button>
    <main class="layout">
      <div class="col-left">
        <section class="panel">
          <div class="panel-title">Transcript</div>
          <div id="transcript" class="transcript"></div>
        </section>
        <section class="panel">
          <div class="panel-title">Component response (JSON)</div>
          <pre id="raw-json" class="raw"></pre>
        </section>
      </div>
      <section class="panel screen">
        <div class="panel-title">Screen</div>
        <div id="ui-root"></div>
      </section>
    </main>
    <script type="module" src="./client.js?v=3"></script>
  </body>
</html>
